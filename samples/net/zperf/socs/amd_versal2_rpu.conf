# Network buffer tuning for amd_versal2_rpu (GEM Ethernet).
# Overrides samples/net/zperf/prj.conf defaults 

CONFIG_NET_PKT_RX_COUNT=128
CONFIG_NET_PKT_TX_COUNT=128
CONFIG_NET_BUF_RX_COUNT=512
CONFIG_NET_BUF_TX_COUNT=512
CONFIG_NET_BUF_DATA_SIZE=1514
CONFIG_NET_ZPERF_MAX_PACKET_SIZE=1514
CONFIG_NET_BUF_POOL_USAGE=y
