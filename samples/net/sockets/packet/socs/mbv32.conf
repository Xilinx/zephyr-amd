#
# Network buffer tuning for mbv32 (AxiEnet).
# Overrides samples/net/sockets/packet/prj.conf defaults.
#
# AxiEnet no memcopy RX stores each received frame in a single net_buf.
# The driver requires:
#   CONFIG_NET_BUF_DATA_SIZE >= XILINX_AXIENET_ETH_BUFFER_SIZE
# where XILINX_AXIENET_ETH_BUFFER_SIZE is NET_ETH_MAX_FRAME_SIZE (1514:
# 1500-byte MTU + 14-byte Ethernet header) rounded up to the RX buffer
# alignment. On mbv32 without data cache that alignment is 4 bytes
# (sizeof(void *)), so the minimum is 1516, not 1514.

CONFIG_NET_BUF_DATA_SIZE=1516
