source [file join [file dirname [info script]] .. .. common xsdb_parse_args.tcl]

proc load_image {} {
	global args_arr
	parse_args {elf pdi} {}

	if { [info exists ::env(HW_SERVER_URL)] } {
		connect -url $::env(HW_SERVER_URL)
	} else {
		connect
	}

	device program $args_arr(pdi)

	if { [info exists ::env(HW_SERVER_URL)] } {
		set hw_server_url [split $::env(HW_SERVER_URL) ":"]
		set host [lindex $hw_server_url 0]
		set port [lindex $hw_server_url 1]
		disconnect
		after 2000
		connect -host $host -port $port
		after 3000
		ta
	}
	after 1000
	targets -set -filter {name =~ "Versal Gen 2*"}
	after 100

	targets -set -filter {name =~ "Cortex-R52*0.0"}
	rst -proc
	after 300
	ta

	after 100
	dow -force $args_arr(elf)
	con
	exit
}

load_image
